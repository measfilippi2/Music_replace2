  <style>
    :root {
      --bg-deep: #040508;
      --accent-rgb: 255, 170, 68;
      --accent-secondary-rgb: 255, 95, 20;
      --accent-main: rgb(var(--accent-rgb));
      --accent-soft: rgba(var(--accent-rgb), 0.35);
      --accent-glow: rgba(var(--accent-rgb), 0.55);
      --hud-cyan: #5ce1e6;
      --glass-bg: rgba(12, 15, 24, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; background-color: var(--bg-deep); color: #ffffff; font-family: 'Chakra Petch', sans-serif; overflow: hidden; }
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 22% 35%, rgba(var(--accent-rgb), 0.16) 0%, transparent 48%),
        radial-gradient(ellipse at 72% 28%, rgba(125, 65, 220, 0.15) 0%, transparent 52%),
        radial-gradient(ellipse at 62% 78%, rgba(35, 130, 210, 0.13) 0%, transparent 55%),
        radial-gradient(circle at 45% 50%, #0b0e1a 0%, #05060c 62%, #020205 100%);
      box-shadow: inset 0 0 90px rgba(var(--accent-rgb), 0.22), inset 0 0 24px rgba(var(--accent-secondary-rgb), 0.38);
      transition: box-shadow 0.45s ease;
    }
    #galaxy-canvas, #globe-container, #visualizer-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #galaxy-canvas { z-index: 0; pointer-events: none; }
    #globe-container { z-index: 1; }
    #globe-container canvas { display: block; width: 100%; height: 100%; }
    #visualizer-canvas { z-index: 4; pointer-events: none; }
    .top-right-clock {
      position: absolute; top: 14px; right: 24px; z-index: 15;
      font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 600;
      color: rgba(255, 255, 255, 0.88); text-shadow: 0 0 12px var(--accent-glow);
    }
    /* Etichetta "stato di provenienza" posizionata sul lato destro del globo */
    .origin-callout {
      position: absolute;
      top: 30%;
      left: 26%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .origin-callout.hidden-space {
      opacity: 0;
      transform: translateX(-18px);
      pointer-events: none;
    }
    .origin-callout .arrow-line {
      width: 36px;
      height: 2px;
      background: linear-gradient(90deg, rgb(var(--accent-secondary-rgb)), var(--accent-main));
      box-shadow: 0 0 10px var(--accent-glow);
      transform: rotate(180deg);
      transform-origin: center;
    }
    .origin-callout .callout-box {
      background: rgba(16, 12, 18, 0.9);
      border: 1.5px solid var(--accent-main);
      border-radius: 6px;
      padding: 6px 12px;
      box-shadow: 0 0 18px var(--accent-soft);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .origin-callout.thasup-mode .callout-box {
      border-color: #c084fc;
      box-shadow: 0 0 22px rgba(168, 85, 247, 0.55);
    }
    .origin-callout .callout-mini {
      display: block;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: rgba(var(--accent-rgb), 0.82);
    }
    .origin-callout.thasup-mode .callout-mini {
      color: #e9d5ff;
    }
    .origin-callout .callout-state {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 10px var(--accent-soft);
    }
    /* Blocco in alto a destra: Titolo canzone e info */
    .lyric-container {
      position: absolute;
      top: 42px;
      right: 24px;
      width: 340px;
      z-index: 10;
      pointer-events: none;
      background: rgba(18, 16, 28, 0.55);
      border: 1px solid rgba(var(--accent-rgb), 0.42);
      border-radius: 12px;
      padding: 12px 16px;
      backdrop-filter: blur(10px);
      transition: border-color 0.4s ease;
    }
    .lyric-ghost {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: rgba(var(--accent-rgb), 0.8);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .lyric-main {
      font-size: clamp(1.3rem, 2.2vw, 1.9rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 14px rgba(0,0,0,0.85), 0 0 18px var(--accent-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lyric-sub {
      display: block;
      font-size: clamp(1rem, 1.6vw, 1.35rem);
      color: rgba(245, 248, 255, 0.92);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Blocco in basso a destra: ORIGIN / STATUS */
    .hud-widget {
      position: absolute;
      bottom: 64px;
      right: 24px;
      width: 340px;
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(135deg, rgba(20, 18, 28, 0.88), rgba(10, 11, 18, 0.78));
      border: 1.5px solid rgba(var(--accent-rgb), 0.6);
      border-radius: 14px;
      padding: 10px 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.65), 0 0 20px rgba(var(--accent-rgb), 0.15);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .hud-dial {
      position: relative; width: 58px; height: 58px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle, #141726 45%, #241428 100%);
      box-shadow: 0 0 16px var(--accent-soft);
    }
    .hud-dial svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .hud-dial-core { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--accent-main); background: #0d1326; }
    .hud-dial-core img { width: 100%; height: 100%; object-fit: cover; }
    .hud-stats { font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; line-height: 1.5; color: rgba(240, 244, 255, 0.92); overflow: hidden; }
    .hud-stats .tag { color: var(--accent-main); font-weight: 700; margin-right: 6px; }
    /* Pannello playlist al centro-destra */
    .spotify-panel {
      position: absolute;
      top: 158px;
      right: 24px;
      width: 340px;
      height: calc(100vh - 335px);
      min-height: 180px;
      background: var(--glass-bg);
      border: 1.5px solid rgba(var(--accent-rgb), 0.48);
      border-radius: 22px;
      backdrop-filter: blur(16px);
      z-index: 30;
      display: none;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      transition: border-color 0.4s ease;
    }
    .spotify-panel.open { display: flex; }
    .spotify-header { padding: 12px 14px; background: rgba(var(--accent-rgb), 0.16); font-weight: 700; font-size: 0.88rem; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;}
    .spotify-list { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .playlist-item, .track-item {
      display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.03);
      cursor: pointer; transition: background 0.2s; font-size: 0.8rem; font-family: 'JetBrains Mono', monospace;
    }
    .playlist-item:hover, .track-item:hover { background: rgba(var(--accent-rgb), 0.22); }
    .playlist-item img, .track-item img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .back-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    /* Comandi di riproduzione in basso al centro */
    .taskbar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      background: rgba(24, 28, 42, 0.65);
      border: 1px solid rgba(var(--accent-rgb), 0.26);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.75);
    }
    .tb-btn {
      appearance: none; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.08);
      color: #ffffff; font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; font-weight: 600;
      padding: 6px 11px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.18s ease;
    }
    .tb-btn:hover { background: rgba(var(--accent-rgb), 0.25); border-color: var(--accent-main); }
    .tb-divider { width: 1px; height: 20px; background: rgba(255, 255, 255, 0.16); margin: 0 2px; }
    .track-pill { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: rgba(255, 255, 255, 0.88); max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        <span id="panel-title">Le tue Playlist</span>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="back-btn" id="back-to-playlists" style="display:none;">⬅ Indietro</button>
          <span style="cursor:pointer; font-size:1rem;" id="close-spotify-panel">✕</span>
        </div>
      </div>
      <div class="spotify-list" id="spotify-list-container">

      </div>
    </div>
    <!-- In basso a destra: ORIGIN / STATUS -->
    <div class="hud-widget">

        <div><span class="tag">STATUS</span><span id="stat-hz">IDLE</span></div>
      </div>
    </div>
    <!-- In basso al centro: Comandi di riproduzione -->
    <div class="taskbar">
      <button class="tb-btn" id="spotify-login-btn" style="background:#1db954; color:#000; border:none; font-weight:700;">🟢 Login Spotify</button>

      <button class="tb-btn" id="btn-prev" style="display:none;">⏮</button>
      <button class="tb-btn" id="btn-play-pause" style="display:none;">⏯</button>
      <button class="tb-btn" id="btn-next" style="display:none;">⏭</button>
      <button class="tb-btn" id="btn-logout" style="display:none; color:#ff7777;">Esci</button>

    </div>

    const originCache = new Map();

    function detectByScriptOrText(text) {
      if (!text) return null;
      if (/[가-힯]/.test(text)) return 'COREA DEL SUD';
      if (/[぀-ヿ一-鿿]/.test(text)) return 'GIAPPONE';
      return null;
    }

    function detectOriginCountry(track) {
      if (!track) return { name: 'ITALIA', coords: COUNTRY_COORDS['ITALIA'] };
      const cacheKey = (track.uri || track.id || `${track.name}__${(track.artists && track.artists[0] && track.artists[0].name) || ''}`).toLowerCase();
      if (originCache.has(cacheKey)) {
        const cachedName = originCache.get(cacheKey);
        return { name: cachedName, coords: COUNTRY_COORDS[cachedName] || COUNTRY_COORDS['USA'] };
      }
      const artists = Array.isArray(track.artists) ? track.artists : [];
      for (const art of artists) {
        const cleanName = (art && art.name) ? art.name.toLowerCase().trim() : '';
        if (ARTIST_COUNTRY_MAP[cleanName]) {
          const found = ARTIST_COUNTRY_MAP[cleanName];
          originCache.set(cacheKey, found);
          return { name: found, coords: COUNTRY_COORDS[found] };
        }
      }
      const combinedText = `${track.name || ''} ${artists.map(a => a.name).join(' ')}`;
      const scriptCountry = detectByScriptOrText(combinedText);
      if (scriptCountry && COUNTRY_COORDS[scriptCountry]) {
        originCache.set(cacheKey, scriptCountry);
        return { name: scriptCountry, coords: COUNTRY_COORDS[scriptCountry] };
      }
      const markets = track.available_markets || (track.album && track.album.available_markets) || [];
      if (Array.isArray(markets) && markets.length > 0 && markets.length <= 15) {
        for (const code of markets) {
          if (MARKET_TO_COUNTRY[code] && COUNTRY_COORDS[MARKET_TO_COUNTRY[code]]) {
            const mCountry = MARKET_TO_COUNTRY[code];
            originCache.set(cacheKey, mCountry);
            return { name: mCountry, coords: COUNTRY_COORDS[mCountry] };
          }
        }
      }
      const fallback = 'USA';
      originCache.set(cacheKey, fallback);
      return { name: fallback, coords: COUNTRY_COORDS[fallback] };
    }

    function updateSpaceBridgeArc(startVec, endVec, progress) {
      if (typeof scene === 'undefined' || !scene || typeof THREE === 'undefined') return;
      if (spaceArcLine) {
        scene.remove(spaceArcLine);
        spaceArcLine.geometry.dispose();
        spaceArcLine = null;
      }
      if (!spaceTransition.active || progress <= 0.01) return;

      const pts = [];
      const segments = 48;
      const arcLift = 1.15;
      const maxIdx = Math.max(2, Math.floor(segments * Math.min(1, progress * 1.25)));

      for (let i = 0; i <= maxIdx; i++) {
        const t = i / segments;
        const p = new THREE.Vector3().lerpVectors(startVec, endVec, t);
        p.y += Math.sin(t * Math.PI) * arcLift;
        p.z += Math.sin(t * Math.PI) * 0.65;
        pts.push(p);
      }

      spaceArcMat.opacity = Math.sin(Math.min(1, progress) * Math.PI) * 0.85;
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      spaceArcLine = new THREE.Line(geo, spaceArcMat);
      scene.add(spaceArcLine);
    }

    function enterThasupSpace() {
      if (typeof applyThemeAccentColors === 'function') {
        applyThemeAccentColors([168, 85, 247], [232, 121, 249]);
      }

      hideOriginCalloutTemporarily();

      if (typeof globeGroup !== 'undefined' && globeGroup) {
        globeGroup.visible = true;
      }
      if (thasupSceneGroup) {
        thasupSceneGroup.position.copy(THASUP_ENTRY_POS);
        thasupSceneGroup.visible = true;
      }

      spaceTransition.active = true;
      spaceTransition.direction = 1;
      spaceTransition.progress = 0;
      spaceTransition.badgeSwapped = false;
    }

    function exitThasupSpace() {
      hideOriginCalloutTemporarily();

      if (typeof globeGroup !== 'undefined' && globeGroup) {
        globeGroup.visible = true;
      }
      if (thasupSceneGroup) {
        thasupSceneGroup.visible = true;
      }

      spaceTransition.active = true;
      spaceTransition.direction = -1;
      spaceTransition.progress = 0;
      spaceTransition.badgeSwapped = false;

      if (
        typeof activeToken !== 'undefined' &&
        activeToken &&
        typeof coverImage !== 'undefined' &&
        coverImage.complete &&
        coverImage.naturalWidth &&
        coverImage.getAttribute('src') &&
        typeof extractPaletteFromCover === 'function'
      ) {
        extractPaletteFromCover(coverImage);
      } else if (
        typeof applyThemeAccentColors === 'function' &&
        typeof DEFAULT_ACCENT_RGB !== 'undefined' &&
        typeof DEFAULT_SECONDARY_RGB !== 'undefined'
      ) {
        applyThemeAccentColors(DEFAULT_ACCENT_RGB, DEFAULT_SECONDARY_RGB);
      }
    }

    function updateThasupScene(nowMs = performance.now(), dt = 0.016) {
      if (spaceTransition.active) {
        spaceTransition.progress = Math.min(1, spaceTransition.progress + dt * 1.15);
        const raw = spaceTransition.progress;
        const ease = raw < 0.5 ? 4 * raw * raw * raw : 1 - Math.pow(-2 * raw + 2, 3) / 2;

        if (spaceTransition.direction === 1) {
          if (typeof globeGroup !== 'undefined' && globeGroup) {
            globeGroup.position.lerpVectors(GLOBE_HOME_POS, GLOBE_EXIT_POS, ease);
          }
          if (thasupSceneGroup) {
            thasupSceneGroup.visible = true;
            thasupSceneGroup.position.lerpVectors(THASUP_ENTRY_POS, THASUP_HOME_POS, ease);
          }
          updateSpaceBridgeArc(
            globeGroup ? globeGroup.position : GLOBE_EXIT_POS,
            thasupSceneGroup ? thasupSceneGroup.position : THASUP_HOME_POS,
            ease
          );

          if (!spaceTransition.badgeSwapped && spaceTransition.progress >= 0.72) {
            spaceTransition.badgeSwapped = true;
            setOriginCalloutForThasup();
          }

          if (spaceTransition.progress >= 1) {
            spaceTransition.active = false;
            if (typeof globeGroup !== 'undefined' && globeGroup) {
              globeGroup.visible = false;
            }
            updateSpaceBridgeArc(GLOBE_EXIT_POS, THASUP_HOME_POS, 0);
          }
        } else if (spaceTransition.direction === -1) {
          if (typeof globeGroup !== 'undefined' && globeGroup) {
            globeGroup.visible = true;
            globeGroup.position.lerpVectors(GLOBE_EXIT_POS, GLOBE_HOME_POS, ease);
          }
          if (thasupSceneGroup) {
            thasupSceneGroup.position.lerpVectors(THASUP_HOME_POS, THASUP_ENTRY_POS, ease);
          }
          updateSpaceBridgeArc(
            thasupSceneGroup ? thasupSceneGroup.position : THASUP_ENTRY_POS,
            globeGroup ? globeGroup.position : GLOBE_HOME_POS,
            ease
          );

          if (!spaceTransition.badgeSwapped && spaceTransition.progress >= 0.72) {
            spaceTransition.badgeSwapped = true;
            restoreOriginCallout();
          }

          if (spaceTransition.progress >= 1) {
            spaceTransition.active = false;
            if (thasupSceneGroup) {
              thasupSceneGroup.visible = false;
            }
            updateSpaceBridgeArc(THASUP_ENTRY_POS, GLOBE_HOME_POS, 0);
          }
        }
      }

      if (!thasupRig || !thasupRig.group.visible) return;

      const t = nowMs * 0.001;
      const { planetMesh, atmosphereMesh, ringMesh, hoodEntity, haloRing, thasupCar, carHalo, carWheels, underglowDisc } = thasupRig;

      planetMesh.rotation.y += 0.004;
      atmosphereMesh.rotation.y -= 0.0025;
      ringMesh.rotation.z += 0.003;

      hoodEntity.position.y = 0.35 + Math.sin(t * 2.2) * 0.12;
      hoodEntity.rotation.y = Math.sin(t * 1.3) * 0.25;
      hoodEntity.rotation.z = Math.cos(t * 1.7) * 0.05;

      haloRing.position.y = 0.96 + Math.sin(t * 3.1) * 0.03;
      haloRing.rotation.z += 0.015;

      if (thasupCar) {
        const beatBoost = typeof playbackState !== 'undefined' && playbackState.isPlaying
          ? (Math.sin(t * 5.2) * 0.04 * (playbackState.energy || 0.5))
          : 0;
        thasupCar.position.x = 1.75 + Math.cos(t * 0.85) * 0.18;
        thasupCar.position.y = -0.35 + Math.sin(t * 2.4) * 0.10 + beatBoost;
        thasupCar.position.z = 1.45 + Math.sin(t * 0.85) * 0.15;
        thasupCar.rotation.y = -0.58 + Math.sin(t * 0.85) * 0.20;
        thasupCar.rotation.z = -0.05 + Math.cos(t * 1.9) * 0.035;
      }
      if (carHalo) {
        carHalo.position.y = 0.72 + Math.sin(t * 3.0) * 0.045;
        carHalo.rotation.z += 0.015;
      }
      if (Array.isArray(carWheels)) {
        carWheels.forEach(w => {
          w.rotation.x += 0.09;
        });
      }
      if (underglowDisc && underglowDisc.material) {
        underglowDisc.material.opacity = 0.34 + (Math.sin(t * 4.0) * 0.12);
      }
    }

    function applyThemeAccentColors(primaryRgb, secondaryRgb) {
      dynamicAccentRgb = [...primaryRgb];
      dynamicSecondaryRgb = [...secondaryRgb];
      const root = document.documentElement.style;
      root.setProperty('--accent-rgb', `${primaryRgb[0]}, ${primaryRgb[1]}, ${primaryRgb[2]}`);
      root.setProperty('--accent-secondary-rgb', `${secondaryRgb[0]}, ${secondaryRgb[1]}, ${secondaryRgb[2]}`);
      if (typeof atmoMat !== 'undefined') {
        atmoMat.color.setRGB(primaryRgb[0] / 255, primaryRgb[1] / 255, primaryRgb[2] / 255);
      }
      if (typeof radarMat !== 'undefined') {

      }
      if (typeof arcMat !== 'undefined') {

      if (typeof haloMat !== 'undefined') {

      }
    }

    function extractPaletteFromCover(img) {
      try {
        if (!img.complete || !img.naturalWidth || !img.getAttribute('src')) return;
        sampleCtx.clearRect(0, 0, 24, 24);
        sampleCtx.drawImage(img, 0, 0, 24, 24);
        const data = sampleCtx.getImageData(0, 0, 24, 24).data;
        let bestScore = -1;
        let bestRgb = [...DEFAULT_ACCENT_RGB];
        let secondRgb = [...DEFAULT_SECONDARY_RGB];
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const a = data[i + 3];
          if (a < 128) continue;
          const maxC = Math.max(r, g, b);
          const minC = Math.min(r, g, b);
          const sat = maxC === 0 ? 0 : (maxC - minC) / maxC;
          const lum = (r + g + b) / 3;
          if (lum < 35 || lum > 235) continue;
          const score = sat * 1.8 + (lum / 255) * 0.4;
          if (score > bestScore) {
            bestScore = score;
            secondRgb = [...bestRgb];
            const boost = lum < 115 ? 1.25 : 1.05;
            bestRgb = [
              Math.min(255, Math.round(r * boost)),
              Math.min(255, Math.round(g * boost)),
              Math.min(255, Math.round(b * boost))
            ];
          }
        }
        if (bestScore > 0) {
          applyThemeAccentColors(bestRgb, secondRgb);
        }
      } catch (_) {
        applyThemeAccentColors(DEFAULT_ACCENT_RGB, DEFAULT_SECONDARY_RGB);
      }
    }

    function setTargetOrigin(name, coords) {
      const nextLat = coords.lat;
      const nextLon = coords.lon;
      const changed = Math.abs(nextLat - playbackState.targetLat) > 0.01 || Math.abs(nextLon - playbackState.targetLon) > 0.01;
      if (changed) {
        playbackState.prevLat = playbackState.targetLat;

    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], '');
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest('SHA-256', data);
    }

    function base64encode(input) {
      return btoa(String.fromCharCode(...new Uint8Array(input)))
        .replace(/=/g, '')
        .replace(/\+/g, '-')
        .replace(/\//g, '_');
    }

    onClick('spotify-login-btn', async () => {
      try {
        const codeVerifier = generateRandomString(64);
        localStorage.setItem('spotify_code_verifier', codeVerifier);
        const hashed = await sha256(codeVerifier);
        const codeChallenge = base64encode(hashed);
        const authUrl = new URL('https://accounts.spotify.com/authorize');
        authUrl.search = new URLSearchParams({
          response_type: 'code',
          client_id: CLIENT_ID,
          scope: SCOPES,
          code_challenge_method: 'S256',
          code_challenge: codeChallenge,
          redirect_uri: REDIRECT_URI,
          show_dialog: 'true'
        }).toString();
        window.location.href = authUrl.toString();
      } catch (err) {
        console.error('Errore avvio login:', err);
        document.getElementById('track-name').textContent = 'ERRORE LOGIN';
      }
    });

    async function exchangeCodeForToken(code) {
      const codeVerifier = localStorage.getItem('spotify_code_verifier');
      if (!codeVerifier) return;
      try {
        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: CLIENT_ID,
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: REDIRECT_URI,
            code_verifier: codeVerifier,
          }),
        });
        const data = await response.json();
        if (data.access_token) {
          localStorage.setItem('spotify_access_token', data.access_token);
          if (data.refresh_token) {
            localStorage.setItem('spotify_refresh_token', data.refresh_token);
          }
          window.history.replaceState({}, document.title, REDIRECT_URI);
          initSpotifySession(data.access_token);
        } else {
          document.getElementById('track-name').textContent = 'TOKEN NON VALIDO';
        }
      } catch (err) {
        console.error('Errore di rete nello scambio token:', err);
      }
    }

    async function refreshSpotifyToken() {
      const refreshToken = localStorage.getItem('spotify_refresh_token');
      if (!refreshToken) return null;
      try {
        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'refresh_token',
            refresh_token: refreshToken,
            client_id: CLIENT_ID
          }),
        });
        const data = await response.json();
        if (data.access_token) {
          localStorage.setItem('spotify_access_token', data.access_token);
          if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
          return data.access_token;
        }
      } catch (err) {
        console.error('Errore nel refresh del token:', err);
      }
      return null;
    }

    function applyTrackUi(track, isPlaying, positionMs) {
      if (!track) return;
      playbackState.isPlaying = Boolean(isPlaying);
      playbackState.progressMs = Number(positionMs) || 0;
      playbackState.durationMs = Number(track.duration_ms) || 180000;
      playbackState.lastSyncAt = performance.now();
      const origin = detectOriginCountry(track);
      setTargetOrigin(origin.name, origin.coords);
      handleTrackSpaceTransition(track);
      const artistName = (track.artists && track.artists[0]) ? track.artists[0].name : 'Artista sconosciuto';
      document.getElementById('track-name').textContent = `${artistName} - ${track.name}`;
      document.getElementById('lyric-line-1').textContent = track.name.toUpperCase();
      document.getElementById('lyric-line-2').textContent = artistName.toUpperCase();
      document.getElementById('stat-hz').textContent = playbackState.isPlaying ? 'IN RIPRODUZIONE' : 'IN PAUSA';
      document.getElementById('btn-play-pause').textContent = playbackState.isPlaying ? '⏸' : '▶';
      if (track.album && track.album.images && track.album.images.length > 0) {
        const coverUrl = track.album.images[0].url;
        if (coverImage.src !== coverUrl) {
          coverImage.crossOrigin = 'anonymous';

    async function setupWebPlaybackSdk() {
      await sdkReadyPromise;
      if (!window.Spotify || !activeToken) return;
      if (spotifyPlayer) {
        spotifyPlayer.disconnect();
        spotifyPlayer = null;
      }
      spotifyPlayer = new window.Spotify.Player({
        name: 'Aether Vibe Web Player',
        getOAuthToken: async cb => {
          const fresh = await refreshSpotifyToken() || activeToken;
          cb(fresh);
        },
        volume: 0.7
      });
      spotifyPlayer.addListener('ready', ({ device_id }) => {
        deviceId = device_id;
      });
      spotifyPlayer.addListener('not_ready', ({ device_id }) => {
        if (deviceId === device_id) deviceId = null;
      });
      spotifyPlayer.addListener('player_state_changed', state => {
        if (!state) return;
        const currentTrack = state.track_window && state.track_window.current_track;
        if (currentTrack) {
          applyTrackUi(currentTrack, !state.paused, state.position);
        }
      });
      spotifyPlayer.addListener('account_error', () => {
        document.getElementById('track-name').textContent = 'AUDIO SDK: SERVE PREMIUM';
      });
      await spotifyPlayer.connect();
    }

    async function playPlaylistTrack(playlistUri, trackIndex) {
      if (!activeToken) return;
      if (spotifyPlayer && spotifyPlayer.activateElement) {

      if (deviceId) {
        await ensureActiveWebDevice();

      const query = deviceId ? `?device_id=${encodeURIComponent(deviceId)}` : '';
      const res = await fetch(`https://api.spotify.com/v1/me/player/play${query}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${activeToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          context_uri: playlistUri,
          offset: { position: trackIndex },
          position_ms: 0
        })
      });

        document.getElementById('track-name').textContent = 'RIPRODUZIONE: SERVE PREMIUM';

    async function fetchCurrentPlayback() {
      if (!activeToken) return;
      try {
        let res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { 'Authorization': `Bearer ${activeToken}` }
        });
        if (res.status === 401) {
          activeToken = await refreshSpotifyToken();
          if (!activeToken) return;
          res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
            headers: { 'Authorization': `Bearer ${activeToken}` }
          });
        }
        if (res.status === 204) {
          playbackState.isPlaying = false;
          document.getElementById('stat-hz').textContent = 'PAUSA / NESSUN BRANO';
          document.getElementById('btn-play-pause').textContent = '▶';
          return;
        }
        if (res.status === 200) {
          const data = await res.json();
          if (data && data.item) {
            applyTrackUi(data.item, data.is_playing, data.progress_ms);
          } else {
            playbackState.isPlaying = false;
            document.getElementById('stat-hz').textContent = 'PAUSA / NESSUN BRANO';
          }
        }
      } catch (e) {
        console.error('Errore sync Spotify:', e);

    }

      container.innerHTML = '<div style="text-align:center; color:#aaa; padding:20px;">Caricamento playlist...</div>';
      try {
        let res = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', {
          headers: { 'Authorization': `Bearer ${activeToken}` }
        });
        if (res.status === 401) {
          activeToken = await refreshSpotifyToken();
          if (!activeToken) return;
          res = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', {
            headers: { 'Authorization': `Bearer ${activeToken}` }
          });
        }
        const data = await res.json();
        container.innerHTML = '';
        if (data.error) {
          container.innerHTML = `<div style="color:#ff7777; padding:10px; text-align:center;">Errore (${data.error.status}): ${data.error.message}</div>`;
          return;
        }
        if (data.items && data.items.length > 0) {
          data.items.forEach(pl => {
            if (!pl) return;
            const img = (pl.images && pl.images.length) ? pl.images[0].url : '';
            const div = document.createElement('div');
            div.className = 'playlist-item';
            div.innerHTML = `<img src="${img}" alt="" /><div><strong>${pl.name}</strong><br><span style="color:#aaa;">Apri playlist</span></div>`;
            div.onclick = () => loadPlaylistTracks(pl.id, pl.name, pl.uri);
            container.appendChild(div);
          });
        } else {
          container.innerHTML = '<div style="color:#aaa; padding:10px; text-align:center;">Nessuna playlist trovata.</div>';
        }
      } catch (e) {
        console.error('Errore caricamento playlist:', e);
        container.innerHTML = '<div style="color:#ff7777; padding:10px; text-align:center;">Errore di connessione.</div>';
      }
    }

    async function loadPlaylistTracks(playlistId, playlistName, playlistUri) {
      if (!activeToken) return;
      const resolvedPlaylistUri = playlistUri || `spotify:playlist:${playlistId}`;
      document.getElementById('panel-title').textContent = playlistName;
      document.getElementById('back-to-playlists').style.display = 'inline-block';
      const container = document.getElementById('spotify-list-container');
      container.innerHTML = '<div style="text-align:center; color:#aaa; padding:20px;">Caricamento brani (fino a 500)...</div>';
      try {
        let nextUrl = `https://api.spotify.com/v1/playlists/${playlistId}/items?limit=50&market=from_token`;
        let allItems = [];
        while (nextUrl && allItems.length < MAX_TRACKS) {
          let res = await fetch(nextUrl, {
            headers: { 'Authorization': `Bearer ${activeToken}` }
          });
          if (res.status === 401) {
            activeToken = await refreshSpotifyToken();
            if (!activeToken) return;
            res = await fetch(nextUrl, {
              headers: { 'Authorization': `Bearer ${activeToken}` }
            });
          }
          const data = await res.json();
          if (data.error) {
            container.innerHTML = `<div style="color:#ff7777; padding:10px; text-align:center;">Errore (${data.error.status}): ${data.error.message}</div>`;
            return;
          }
          if (data.items && data.items.length > 0) {
            const remaining = MAX_TRACKS - allItems.length;
            allItems = allItems.concat(data.items.slice(0, remaining));
          }
          nextUrl = allItems.length < MAX_TRACKS ? data.next : null;
        }
        container.innerHTML = '';
        let loadedCount = 0;
        allItems.forEach((entry, idx) => {
          const track = (entry && (entry.item || entry.track)) || entry;
          if (!track || !track.name) return;
          const trackIndex = idx;
          loadedCount++;
          const trackName = track.name;
          const artistNames = track.artists ? track.artists.map(a => a.name).join(', ') : 'Artista sconosciuto';
          const img = (track.album && track.album.images && track.album.images.length > 0)
            ? track.album.images[track.album.images.length - 1].url
            : '';
          const div = document.createElement('div');
          div.className = 'track-item';
          div.innerHTML = `<img src="${img}" style="background:#222;" alt="" /><div><strong>${trackName}</strong><br><span style="color:#aaa;">${artistNames}</span></div>`;
          div.onclick = () => playPlaylistTrack(resolvedPlaylistUri, trackIndex);
          container.appendChild(div);
        });
        document.getElementById('panel-title').textContent = `${playlistName} (${loadedCount})`;
        if (loadedCount === 0) {
          container.innerHTML = '<div style="color:#aaa; padding:10px; text-align:center;">Nessun brano trovato nella playlist.</div>';
        }
      } catch (e) {
        console.error('Errore caricamento tracce:', e);
        container.innerHTML = '<div style="color:#ff7777; padding:10px; text-align:center;">Errore di caricamento tracce.</div>';
      }
    }

      stars = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.65 + 0.35,
        baseAlpha: Math.random() * 0.75 + 0.2,
        twinkleSpeed: Math.random() * 2.4 + 0.6,
        phase: Math.random() * Math.PI * 2,
        driftX: (Math.random() - 0.5) * 6,
        driftY: (Math.random() - 0.5) * 6,

    function drawGalaxy(t, dt, bassKick) {
      if (!galaxyCtx || !galaxyCanvas) return;
      galaxyCtx.clearRect(0, 0, width, height);
      const [ar, ag, ab] = dynamicAccentRgb;
      const bandGrad = galaxyCtx.createLinearGradient(0, height * 0.85, width, height * 0.15);
      bandGrad.addColorStop(0, `rgba(${ar}, ${ag}, ${ab}, 0.035)`);
      bandGrad.addColorStop(0.5, `rgba(165, 95, 255, ${0.05 + bassKick * 0.025})`);
      bandGrad.addColorStop(1, `rgba(60, 160, 255, 0.025)`);
      galaxyCtx.fillStyle = bandGrad;
      galaxyCtx.fillRect(0, 0, width, height);
      const sec = t * 0.001;
      for (const s of stars) {
        s.x += s.driftX * dt * (0.4 + playbackState.energy * 0.8);
        s.y += s.driftY * dt * (0.4 + playbackState.energy * 0.8);
        if (s.x < 0) s.x += width;
        if (s.x > width) s.x -= width;
        if (s.y < 0) s.y += height;
        if (s.y > height) s.y -= height;
        const twinkle = 0.65 + 0.35 * Math.sin(sec * s.twinkleSpeed + s.phase);
        const alpha = Math.min(1, s.baseAlpha * twinkle + bassKick * 0.12 * playbackState.energy);
        const radius = s.r * (1 + bassKick * 0.25 * playbackState.energy);
        galaxyCtx.beginPath();
        galaxyCtx.arc(s.x, s.y, radius, 0, Math.PI * 2);
        galaxyCtx.fillStyle = s.warmTint
          ? `rgba(${ar}, ${ag}, ${ab}, ${alpha})`
          : `rgba(225, 235, 255, ${alpha})`;
        galaxyCtx.fill();
      }
    }

    function paintMapBase(ctx, width, height) {
      const oceanGrad = ctx.createLinearGradient(0, 0, 0, height);
      oceanGrad.addColorStop(0, '#6d2a07');
      oceanGrad.addColorStop(0.5, '#a8470d');
      oceanGrad.addColorStop(1, '#6d2a07');
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0, 0, width, height);
      for (let lon = -180; lon <= 180; lon += 15) {
        const x = ((lon + 180) / 360) * width;
        ctx.strokeStyle = lon === 0 ? 'rgba(255, 235, 180, 0.25)' : 'rgba(255, 220, 155, 0.09)';
        ctx.lineWidth = lon === 0 ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let lat = -90; lat <= 90; lat += 15) {
        const y = ((90 - lat) / 180) * height;
        ctx.strokeStyle = lat === 0 ? 'rgba(255, 235, 180, 0.25)' : 'rgba(255, 220, 155, 0.09)';
        ctx.lineWidth = lat === 0 ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    function drawGeoJsonRings(ctx, rings, width, height) {
      rings.forEach(ring => {
        if (!Array.isArray(ring) || ring.length < 3) return;
        ctx.beginPath();
        ring.forEach(([lon, lat], idx) => {
          const x = ((lon + 180) / 360) * width;
          const y = ((90 - lat) / 180) * height;
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fillStyle = '#ff962e';
        ctx.fill();
        ctx.strokeStyle = '#fff0b3';
        ctx.lineWidth = 2.2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.stroke();
      });
    }

    function createWorldMapTexture() {
      const c = document.createElement('canvas');
      c.width = 4096;
      c.height = 2048;
      const ctx = c.getContext('2d');
      paintMapBase(ctx, c.width, c.height);
      drawFallbackContinents(ctx, c.width, c.height);
      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.needsUpdate = true;
      fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
        .then(r => r.json())
        .then(async topo => {
          const topoMod = await import('https://esm.sh/topojson-client@3');
          const geo = topoMod.feature(topo, topo.objects.countries);
          if (!geo || !Array.isArray(geo.features)) return;
          paintMapBase(ctx, c.width, c.height);
          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
          ctx.shadowBlur = 12;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 4;
          geo.features.forEach(feat => {
            const geom = feat && feat.geometry;
            if (!geom) return;
            if (geom.type === 'Polygon') {
              drawGeoJsonRings(ctx, geom.coordinates, c.width, c.height);
            } else if (geom.type === 'MultiPolygon') {
              geom.coordinates.forEach(poly => drawGeoJsonRings(ctx, poly, c.width, c.height));
            }
          });
          ctx.restore();
          tex.needsUpdate = true;
        })
        .catch(() => {});
      return tex;
    }

    let arcLine = null;

    function latLonToVector3(lat, lon, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function rebuildArcGeometry(lat1, lon1, lat2, lon2) {
      if (arcLine) {
        globeGroup.remove(arcLine);
        arcLine.geometry.dispose();
        arcLine = null;
      }
      const start = latLonToVector3(lat1, lon1, 1.78);
      const end = latLonToVector3(lat2, lon2, 1.78);
      const dist = start.distanceTo(end);
      if (dist < 0.02) return;
      const segments = 64;
      const pts = [];
      const lift = Math.min(0.65, 0.18 + dist * 0.28);
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const interp = new THREE.Vector3().lerpVectors(start, end, t).normalize();
        const heightOffset = 1.78 + Math.sin(t * Math.PI) * lift;
        pts.push(interp.multiplyScalar(heightOffset));
      }
      arcPoints = pts;
      const geo = new THREE.BufferGeometry().setFromPoints(pts.slice(0, 2));
      arcLine = new THREE.Line(geo, arcMat);
      globeGroup.add(arcLine);
    }

    // --- VISUALIZZATORE TONDO CENTRALE ---
    const visCanvas = document.getElementById('visualizer-canvas');
    const visCtx = visCanvas.getContext('2d');
    let width = window.innerWidth, height = window.innerHeight;
    let lastFrameTime = performance.now();

    function resize() {
      width = window.innerWidth; height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      visCanvas.width = width; visCanvas.height = height;
      if (galaxyCanvas) {
        galaxyCanvas.width = width;
        galaxyCanvas.height = height;

    window.addEventListener('resize', resize);
    resize();

    function renderLoop(t) {
      const dt = Math.min(0.05, (t - lastFrameTime) * 0.001);
      lastFrameTime = t;
      let currentPosMs = playbackState.progressMs;
      if (playbackState.isPlaying) {
        currentPosMs += (t - playbackState.lastSyncAt);
        if (playbackState.durationMs > 0) {
          currentPosMs = Math.min(currentPosMs, playbackState.durationMs);
        }
      }
      const targetEnergy = playbackState.isPlaying ? 1.0 : 0.06;
      playbackState.energy += (targetEnergy - playbackState.energy) * Math.min(1, dt * 8);
      const tempoHz = playbackState.isPlaying ? 2.0 : 0.35;
      playbackState.beatPhase += dt * tempoHz * Math.PI * 2;
      const songSec = currentPosMs * 0.001;
      const bassKick = playbackState.isPlaying
        ? Math.pow(Math.max(0, Math.sin(playbackState.beatPhase)), 3)
        : 0.15;

      drawGalaxy(t, dt, bassKick);

      const desiredRotY = -((playbackState.targetLon + 90) * (Math.PI / 180));
      const desiredRotX = (playbackState.targetLat * (Math.PI / 180)) * 0.65;
      globeGroup.rotation.y += (desiredRotY - globeGroup.rotation.y) * Math.min(1, dt * 2.5);
      globeGroup.rotation.x += (desiredRotX - globeGroup.rotation.x) * Math.min(1, dt * 2.5);

      const pinPos = latLonToVector3(playbackState.targetLat, playbackState.targetLon, 1.78);
      const pinNormal = pinPos.clone().normalize();
      pinMesh.position.copy(pinPos);
      haloMesh.position.copy(pinNormal.clone().multiplyScalar(1.785));
      haloMesh.lookAt(camera.position);
      const pinScale = 1 + bassKick * 0.65 * playbackState.energy;
      pinMesh.scale.set(pinScale, pinScale, pinScale);
      haloMesh.scale.set(pinScale, pinScale, pinScale);

      // Aggiorna onde radar satellitari attorno al pin
      const radarSpeed = playbackState.isPlaying ? (0.65 + bassKick * 0.45) : 0.22;
      radarRings.forEach(ring => {
        const cycle = ((t * 0.001 * radarSpeed) + ring.userData.phaseOffset) % 1;
        const scale = 1 + cycle * 4.2;
        ring.position.copy(pinNormal.clone().multiplyScalar(1.786));
        ring.lookAt(camera.position);
        ring.scale.set(scale, scale, 1);
        ring.material.opacity = (1 - cycle) * (0.35 + 0.45 * playbackState.energy);
      });

      // Aggiorna animazione arco 3D tra Stati
      if (playbackState.arcActive && arcLine && arcPoints.length > 1) {
        playbackState.arcProgress = Math.min(1, playbackState.arcProgress + dt * 1.15);
        const visibleCount = Math.max(2, Math.floor(arcPoints.length * playbackState.arcProgress));
        arcLine.geometry.dispose();
        arcLine.geometry = new THREE.BufferGeometry().setFromPoints(arcPoints.slice(0, visibleCount));
        arcMat.opacity = playbackState.arcProgress < 0.98 ? 0.92 : Math.max(0.18, arcMat.opacity - dt * 0.25);
      }

      updateThasupScene(t, dt);
      renderer.render(scene, camera);

      visCtx.clearRect(0, 0, width, height);
      const [ar, ag, ab] = dynamicAccentRgb;
      const cx = width * 0.52, cy = height * 0.5;
      const pulse = bassKick * 9 * playbackState.energy;
      const r = Math.min(width, height) * 0.145 + pulse;
      const bars = 90;
      for (let i = 0; i < bars; i++) {
        const angle = (i / bars) * Math.PI * 2 + (playbackState.isPlaying ? songSec * 0.18 : 0);
        const harmonic = Math.abs(Math.sin(songSec * 6.5 + i * 0.35 + playbackState.beatPhase * 0.5));
        const lowFreqBoost = 0.65 + 0.35 * Math.cos(i * 0.2);
        const barH = 4 + (harmonic * 26 * lowFreqBoost + bassKick * 18) * playbackState.energy;
        visCtx.strokeStyle = `rgba(${ar}, ${ag}, ${ab}, ${0.35 + 0.55 * playbackState.energy})`;
        visCtx.lineWidth = 3;
        visCtx.lineCap = 'round';
        visCtx.beginPath();
        visCtx.moveTo(cx + Math.cos(angle) * (r + 4), cy + Math.sin(angle) * (r + 4));
        visCtx.lineTo(cx + Math.cos(angle) * (r + 4 + barH), cy + Math.sin(angle) * (r + 4 + barH));
        visCtx.stroke();
      }
      const hasCover = Boolean(activeToken && coverImage.complete && coverImage.naturalWidth > 0 && coverImage.getAttribute('src'));
      visCtx.save();
      visCtx.beginPath();
      visCtx.arc(cx, cy, r, 0, Math.PI * 2);
      visCtx.closePath();
      visCtx.clip();
      if (hasCover) {
        visCtx.drawImage(coverImage, cx - r, cy - r, r * 2, r * 2);
      } else {
        visCtx.fillStyle = '#111625';
        visCtx.fillRect(cx - r, cy - r, r * 2, r * 2);
      }
      visCtx.restore();
      visCtx.strokeStyle = `rgb(${ar}, ${ag}, ${ab})`;
      visCtx.lineWidth = 2.5;
      visCtx.beginPath();
      visCtx.arc(cx, cy, r, 0, Math.PI * 2);
      visCtx.stroke();
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);
  </script>
